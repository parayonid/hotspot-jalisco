
<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    HOTSPOT · Observatorio y laboratorio espacial
  </title>

  <style>

    :root {
      color-scheme: dark;
      font-family:
        system-ui,
        -apple-system,
        'Segoe UI',
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: #090f1e;
      color: #edf0fa;
    }

    .shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      min-height: 550px;
    }

    /* ====================================
       BARRA DE NAVEGACION
       ==================================== */

    .top {
      background: #131b30;

      border-bottom:
        1px solid #354364;

      display: flex;

      align-items: center;

      gap: 18px;

      padding: 10px 17px;

      min-height: 76px;
    }

    .brand {
      flex: 0 0 auto;

      font-weight: 850;

      font-size: 23px;

      letter-spacing: .13em;

      line-height: 1.1;
    }

    .brand span {
      color: #aa8bff;
    }

    .brand small {
      display: block;

      font-size: 10px;

      letter-spacing: .1em;

      color: #9eafc7;

      font-weight: 500;

      margin-top: 5px;
    }

    /* ====================================
       BOTONES DE NAVEGACION
       ==================================== */

    nav {
      display: flex;

      gap: 6px;

      flex-wrap: wrap;

      flex: 1;

      justify-content: center;
    }

    nav button {
      border: 1px solid transparent;

      background: transparent;

      border-radius: 9px;

      color: #b5c3d9;

      padding: 10px 12px;

      font: 600 12px system-ui;

      cursor: pointer;

      white-space: nowrap;
    }

    nav button:hover {
      background: #202b42;
      color: #fff;
    }

    nav button[aria-current="page"] {
      background: #342451;

      border-color: #8262b9;

      color: #fff;
    }

    /* ====================================
       ESTADO DE LA APLICACION
       ==================================== */

    .status {
      font-size: 11px;

      color: #9eb1cb;

      text-align: right;

      max-width: 180px;

      flex: 0 0 155px;

      line-height: 1.4;
    }

    /* ====================================
       CONTENEDOR DE MODULOS
       ==================================== */

    .workspace {
      flex: 1;

      min-height: 0;

      position: relative;
    }

    iframe {
      display: block;

      width: 100%;

      height: 100%;

      border: 0;

      background: #0b1020;
    }

    .loading {
      position: absolute;

      inset: 0;

      display: grid;

      place-items: center;

      background: #0b1020;

      color: #acb9d5;

      z-index: 3;

      font-size: 14px;
    }

    .loading[hidden] {
      display: none;
    }

    /* ====================================
       PIE DE PAGINA
       ==================================== */

    .footer {
      font-size: 11px;

      background: #0f1729;

      color: #9baac2;

      padding: 7px 16px;

      border-top: 1px solid #2b3851;

      display: flex;

      gap: 16px;

      justify-content: space-between;
    }

    /* ====================================
       RESPONSIVE
       ==================================== */

    @media (max-width: 990px) {

      .top {
        flex-wrap: wrap;
        gap: 8px;
      }

      .status {
        display: none;
      }

      .brand {
        font-size: 20px;
      }

      nav {
        justify-content: flex-start;
      }
    }

    @media (max-width: 550px) {

      .top {
        padding: 9px;
      }

      .brand small {
        display: none;
      }

      nav button {
        padding: 8px;
        font-size: 11px;
      }

      .footer {
        font-size: 10px;
      }
    }

  </style>
</head>

<body>

  <!-- =====================================
       APLICACION PRINCIPAL
       ===================================== -->

  <div class="shell">

    <header class="top">

      <div class="brand">
        HOTSPOT<span>.</span>

        <small>
          OBSERVATORIO · ETAPA 22
        </small>
      </div>

      <!-- NAVEGACION -->

      <nav aria-label="Vistas de Hotspot">

        <button
          type="button"
          data-mode="territorio"
          aria-current="page"
        >
          Territorio
        </button>

        <button
          type="button"
          data-mode="red"
        >
          Red urbana
        </button>

        <button
          type="button"
          data-mode="municipal3d"
        >
          Grafo municipal 3D
        </button>

        <button
          type="button"
          data-mode="urbano3d"
        >
          Grafo de siniestros 3D
        </button>

        <button
          type="button"
          data-mode="ciencia"
        >
          Panel científico
        </button>

      </nav>

      <div
        class="status"
        id="appStatus"
        role="status"
      >
        Iniciando observatorio...
      </div>

    </header>

    <!-- ==================================
         CONTENEDOR DINAMICO
         ================================== -->

    <main class="workspace">

      <div
        class="loading"
        id="loading"
      >
        Cargando módulo...
      </div>

      <iframe
        id="module"
        title="Vista de Hotspot"
        referrerpolicy="same-origin"
      ></iframe>

    </main>

    <!-- ==================================
         PIE DE PAGINA
         ================================== -->

    <footer class="footer">

      <span>
        Datos observados ≠ tasas de riesgo ·
        Siniestralimap: cobertura limitada y
        ubicaciones aproximadas
      </span>

      <span>
        ATUS 2025 · DENUE 2025 ·
        Siniestralimap 2015–2025
      </span>

    </footer>

  </div>

  <!-- =====================================
       MOTOR DE NAVEGACION
       ===================================== -->

  <script>

    (() => {

      "use strict";

      // ==================================
      // 1. ELEMENTOS
      // ==================================

      const iframe =
        document.getElementById("module");

      const loading =
        document.getElementById("loading");

      const status =
        document.getElementById("appStatus");

      const buttons = [
        ...document.querySelectorAll(
          "nav [data-mode]"
        )
      ];

      // ==================================
      // 2. RUTAS DE LOS MODULOS
      // ==================================

      const ROUTES = {

        territorio: {
          view: "municipal",
          file: "22_visor_municipal.html",
          action: ""
        },

        red: {
          view: "urbano",
          file: "22_2_visor_urbano.html",
          action: ""
        },

        municipal3d: {
          view: "municipal",
          file: "22_visor_municipal.html",
          action: "municipal3d"
        },

        urbano3d: {
          view: "urbano",
          file: "22_2_visor_urbano.html",
          action: "urbano3d"
        },

        ciencia: {
          view: "municipal",
          file: "22_visor_municipal.html",
          action: "ciencia"
        }

      };

      // ==================================
      // 3. ESTADO GLOBAL
      // ==================================

      const state = {

        municipio: "",

        indicador: "denue_mayo_2025",

        anio: "2025",

        puntos: false,

        celda: ""
      };

      let currentMode = "";

      let ready = false;

      // ==================================
      // 4. CAMBIAR DE VISTA
      // ==================================

      function go(mode) {

        const route = ROUTES[mode];

        if (
          !route ||
          mode === currentMode
        ) {
          return;
        }

        currentMode = mode;

        ready = false;

        loading.hidden = false;

        status.textContent =
          "Cargando " + mode + "...";

        // Marcar botón activo.

        buttons.forEach(button => {

          button.setAttribute(

            "aria-current",

            button.dataset.mode === mode
              ? "page"
              : "false"
          );

        });

        // Crear URL de la vista.

        const url = new URL(
          route.file,
          location.href
        );

        // Al navegar, se destruye
        // el documento anterior.
        // Esto evita mantener varias
        // escenas WebGL simultáneamente.

        iframe.src = url.href;

        iframe.title =
          `Hotspot · ${mode}`;

        // Sincronizar fragmento de URL.

        if (
          location.hash !== "#" + mode
        ) {

          history.replaceState(
            null,
            "",
            "#" + mode
          );
        }
      }

      // ==================================
      // 5. BOTONES DE NAVEGACION
      // ==================================

      buttons.forEach(button => {

        button.addEventListener(
          "click",
          () => {
            go(button.dataset.mode);
          }
        );

      });

      // ==================================
      // 6. COMUNICACION ENTRE VISTAS
      // ==================================

      window.addEventListener(
        "message",
        event => {

          // Aceptar solo mensajes
          // de nuestro propio iframe.

          if (
            event.source !==
              iframe.contentWindow ||

            event.origin !==
              location.origin
          ) {

            return;
          }

          const msg = event.data;

          if (
            msg?.app !== "hotspot22"
          ) {
            return;
          }

          const route =
            ROUTES[currentMode];

          if (
            !route ||
            msg.view !== route.view
          ) {
            return;
          }

          // El módulo terminó de cargar.

          if (
            msg.type === "READY" &&
            !ready
          ) {

            ready = true;

            loading.hidden = true;

            status.textContent =
              "Vista lista · " +
              currentMode;

            // Restaurar selección
            // y filtros existentes.

            iframe.contentWindow.postMessage(

              {

                app: "hotspot22",

                type: "RESTORE",

                view: route.view,

                detail: {

                  ...state,

                  action: route.action
                }

              },

              location.origin
            );

          }

          // Guardar cambios del módulo.

          else if (
            msg.type === "STATE"
          ) {

            const changes =
              msg.detail || {};

            for (
              const key of Object.keys(state)
            ) {

              if (
                Object.prototype
                  .hasOwnProperty.call(
                    changes,
                    key
                  )
              ) {

                state[key] =
                  changes[key];
              }
            }
          }
        }
      );

      // ==================================
      // 7. ERRORES DE CARGA
      // ==================================

      iframe.addEventListener(
        "error",
        () => {

          loading.textContent =
            "No se pudo cargar el módulo. " +
            "Revisa los archivos y la consola.";

        }
      );

      // ==================================
      // 8. VISTA INICIAL
      // ==================================

      const initial =
        location.hash.slice(1);

      go(
        ROUTES[initial]
          ? initial
          : "territorio"
      );

      // ==================================
      // 9. NAVEGACION CON URL
      // ==================================

      window.addEventListener(
        "hashchange",
        () => {

          const mode =
            location.hash.slice(1);

          if (ROUTES[mode]) {
            go(mode);
          }
        }
      );

    })();

  </script>

</body>
</html>
